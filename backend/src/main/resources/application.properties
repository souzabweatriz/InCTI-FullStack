spring.application.name=backend

# Lê as mesmas variáveis do run-local.ps1 e do .env do Python;
# os valores após ":" são os padrões para rodar localmente.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:incti}?sslmode=${DB_SSLMODE:prefer}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:ds564}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

api.security.token.secret=${JWT_SECRET:InCTI-chave-local-teste-2026-uma-chave-bem-longa}
api.security.token.expiration-minutes=120
api.security.cors.allowed-origin=${CORS_ORIGIN:http://localhost:5173}

# Precisa bater com ETL_API_KEY do analytics-python/.env, senão o Python responde 401.
analytics.python.url=${ETL_URL:${ANALYTICS_PYTHON_URL:http://localhost:8000}}
analytics.python.key=${ETL_KEY:${ETL_API_KEY:incti-etl-chave-local-2026}}

# Devolve a mensagem das exceções (ex.: "Nenhum lote processado") para o frontend
server.error.include-message=always
